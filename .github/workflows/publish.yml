name: Publish image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - default.conf
      - .gitconfig
      - .github/workflows/publish.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read PHP version from Dockerfile
        id: version
        run: echo "php=$(sed -nE 's/^FROM php:([0-9.]+)-.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: renfire
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: tbp-web-server:test

      - name: Check extensions
        run: |
          docker run --rm --entrypoint php tbp-web-server:test -r '
            foreach (["mysqli","pgsql","pdo_pgsql","sqlsrv","pdo_sqlsrv","imagick","gd","zip"] as $e) {
              if (!extension_loaded($e)) { echo "missing $e\n"; exit(1); }
            }'

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            renfire/tbp-web-server:${{ steps.version.outputs.php }}
            renfire/tbp-web-server:latest
